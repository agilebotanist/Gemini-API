# CI for the fork: lint, the offline test suite, and a secret scan.
#
# Upstream ships release/publish workflows only, because its tests need a live Google
# account. The auth layer's tests do not (ADR-0008), so they can run on every push -
# which is the point of having written them that way.
#
# The secret scan is not ceremony: this fork is PUBLIC (a fork of a public repo cannot
# be made private) and the code's whole subject is session cookies. See ADR-0001.
name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The lock and the file modes are platform-specific (msvcrt vs fcntl, ACLs vs
        # mode bits), so the suite has to run on both families or half of it is untested.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # No `playwright` extra: the login flow is tested through its injected seam, and
        # a browser download per matrix cell would buy nothing (ADR-0008).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser]" pytest
      - name: Offline test suite
        run: pytest tests/unit -q
      - name: Import the CLI without the playwright extra
        # Guards the optional-dependency boundary: `gemini-web --help` and `gemini-web doctor`
        # must work on a host where Playwright is not installed.
        run: |
          gemini-web --help
          gemini-web doctor || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

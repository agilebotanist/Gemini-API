[build-system]
requires = ["setuptools>=69", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-webapi"
authors = [{ name = "UZQueen" }]
description = "✨ An elegant async Python wrapper for Google Gemini web app"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["API", "async", "Gemini", "Bard", "Google", "Generative AI", "LLM"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
  "curl-cffi~=0.16.0",
  "loguru~=0.7.3",
  "orjson~=3.11.9",
  "pydantic~=2.12.5",
]
dynamic = ["version"]

[project.optional-dependencies]
browser = ["browser-cookie3"]
# `gemini-web login` - a real browser doing a real Google sign-in (ADR-0002). Optional so
# the library keeps installing on hosts that cannot run a browser at all.
playwright = ["playwright>=1.40"]
dev = ["pyright", "ruff", "ty", "pytest"]

[dependency-groups]
dev = [
  "gemini-webapi[browser,playwright,dev]", # extras keep the optional imports type-checkable
]

[project.scripts]
# `gemini-web`, not `gemini`: Google's own `gemini-cli` (npm `@google/gemini-cli`) owns
# that name on any machine that has it installed, and a shadowed console script is a
# support ticket waiting to happen. `gemini-webapi` is the long form, matching the
# distribution name.
gemini-web = "gemini_webapi.cli:main"
gemini-webapi = "gemini_webapi.cli:main"

[project.urls]
Repository = "https://github.com/agilebotanist/Gemini-API"
Upstream = "https://github.com/HanaokaYuzu/Gemini-API"
Issues = "https://github.com/agilebotanist/Gemini-API/issues"

[tool.setuptools.packages.find]
where = ["src"]
# `gemini_webapi*`, not `gemini_webapi`: the fork adds `auth` and `cli` subpackages,
# and a bare name would ship the top level only - broken wheels, working editable
# installs, which is the worst way to find out.
include = ["gemini_webapi*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "G",   # flake8-logging-format
  "I",   # isort
  "LOG", # flake8-logging
  "N",   # pep8-naming
  "PIE", # flake8-pie
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "E501", # line too long, enforced by the formatter for code
]

[tool.ruff.lint.per-file-ignores]
# The suites are stdlib `unittest`, matching upstream's, so pytest-style assertion
# rewriting rules do not apply. Keeping `self.assertEqual` also keeps a failure message
# that names both values, which a bare `assert` does not without pytest's rewriter.
"tests/**" = [
  "PT009", # unittest-style assertions: deliberate, see above
  "PT027", # self.assertRaises: same reason
  "B017",  # assertRaises(Exception): used where the point is "any failure, no crash"
  "N802",  # helper names mirroring unittest's camelCase (assertNoSecret)
  "SIM117",# nested `with`: the fixture-then-subject nesting reads better than a chain
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
# Default to the offline suite: no network, no browser, no credentials. The other test
# modules are upstream's live tests, which reach gemini.google.com in `setUp` - they
# authenticate through whatever session the auth ladder finds, so they are neither
# hermetic nor safe to run by reflex. Run them deliberately:
#     pytest tests/test_client_features.py
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-q"
